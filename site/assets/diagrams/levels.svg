<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="lv-t lv-d" class="dg dg-levels">
  <title id="lv-t">Four rungs of connection</title>
  <desc id="lv-d">Rung 1 Observe and rung 2 Relay look plausible but are not tested. Rung 3 Automate and rung 4 Transfer value are not available and only Quant can unlock them.</desc>
  <line class="dg-line" x1="24" y1="352" x2="936" y2="352"/>
  <line class="dg-divider" x1="480" y1="40" x2="480" y2="352"/>
  <text class="dg-cap" x="246" y="384" text-anchor="middle">ANY OVERLEDGER ACCOUNT COULD ATTEMPT THESE</text>
  <text class="dg-cap dg-cap-brand" x="714" y="34" text-anchor="middle">ONLY QUANT CAN UNLOCK THESE</text>
  <g class="dg-step" style="--i:0">
    <rect class="dg-card" x="24" y="202" width="210" height="150" rx="8"/>
    <text class="dg-mono" x="40" y="230">RUNG 1</text>
    <text class="dg-title" x="40" y="258">Observe</text>
    <text class="dg-text" x="40" y="282">Overledger returns</text>
    <text class="dg-text" x="40" y="300">Redbelly data</text>
    <circle class="dg-dot-warn" cx="46" cy="330" r="5"/><text class="dg-mono" x="58" y="334">NOT TESTED</text>
  </g>
  <g class="dg-step" style="--i:1">
    <rect class="dg-card" x="258" y="162" width="210" height="190" rx="8"/>
    <text class="dg-mono" x="274" y="190">RUNG 2</text>
    <text class="dg-title" x="274" y="218">Relay</text>
    <text class="dg-text" x="274" y="242">Forwards transactions</text>
    <text class="dg-text" x="274" y="260">verified users signed</text>
    <circle class="dg-dot-warn" cx="280" cy="330" r="5"/><text class="dg-mono" x="292" y="334">NOT TESTED</text>
  </g>
  <g class="dg-step" style="--i:2">
    <rect class="dg-card" x="492" y="122" width="210" height="230" rx="8"/>
    <text class="dg-mono" x="508" y="150">RUNG 3</text>
    <text class="dg-title" x="508" y="178">Automate</text>
    <text class="dg-text" x="508" y="202">Flow Apps, Quant keys,</text>
    <text class="dg-text" x="508" y="220">event trackers</text>
    <circle class="dg-dot-no" cx="514" cy="330" r="5"/><text class="dg-mono" x="526" y="334">NOT AVAILABLE</text>
  </g>
  <g class="dg-step" style="--i:3">
    <rect class="dg-card" x="726" y="82" width="210" height="270" rx="8"/>
    <text class="dg-mono" x="742" y="110">RUNG 4</text>
    <text class="dg-title" x="742" y="138">Transfer value</text>
    <text class="dg-text" x="742" y="162">Tokens or messages</text>
    <text class="dg-text" x="742" y="180">via Fusion or a bridge</text>
    <circle class="dg-dot-no" cx="748" cy="330" r="5"/><text class="dg-mono" x="760" y="334">NOT AVAILABLE</text>
  </g>
  <path class="dg-flow" d="M129 196 C 200 150, 300 150, 363 156 S 520 110, 597 116 S 760 70, 831 76"/>
</svg>
